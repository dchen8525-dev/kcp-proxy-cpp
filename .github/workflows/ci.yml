name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, toolchain-free checks. Runs first so a whitespace error or a broken
  # packaging invariant is reported in seconds instead of after three builds.
  hygiene:
    name: whitespace + packaging smoke
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      with:
        # git diff --check needs the base commit, which a shallow clone lacks.
        fetch-depth: 0

    - name: Check whitespace (git diff --check)
      shell: bash
      run: |
        set -euo pipefail

        # Check only the lines this change introduces, by comparing against the
        # commit it is based on. AGENTS.md requires `git diff --check` to pass.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="${{ github.base_ref }}"
          # fetch-depth: 0 already brought every branch, so origin/$base normally
          # exists and no fetch is needed. It is fetched only as a fallback, and
          # WITHOUT --depth: a shallow fetch marks the repo shallow, after which
          # the three-dot diff below dies with "no merge base" (exit 128) -- i.e.
          # the step would fail on every pull request it was meant to protect.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$base" >/dev/null; then
            git fetch --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base"
          fi
          range="refs/remotes/origin/$base...HEAD"
        elif [ -n "${{ github.event.before }}" ] \
             && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          range="${{ github.event.before }}..HEAD"
        elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
          # workflow_dispatch / a branch's very first push have no usable base.
          range="HEAD^..HEAD"
        else
          echo "No base commit to compare against; nothing to check."
          exit 0
        fi

        echo "git diff --check over $range"
        git diff --check "$range"

    - name: Packaging / deployment smoke tests
      run: python3 tests/smoke/smoke_test.py

  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: c5a15727ee70fddf0296f0d8aafc3f58916fefac
        vcpkgJsonGlob: '**/vcpkg.json'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
        ./kcp_proxy_test

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-binaries
        path: |
          build/kcp-proxy-server
          build/kcp-proxy-client

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: c5a15727ee70fddf0296f0d8aafc3f58916fefac
        vcpkgJsonGlob: '**/vcpkg.json'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Run tests
      run: |
        cd build
        ctest -C Release --output-on-failure
        .\Release\kcp_proxy_test.exe

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-binaries
        path: |
          build/Release/kcp-proxy-server.exe
          build/Release/kcp-proxy-client.exe
          build/vcpkg_installed/x64-windows/bin/*.dll

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        brew install cmake openssl

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: c5a15727ee70fddf0296f0d8aafc3f58916fefac
        vcpkgJsonGlob: '**/vcpkg.json'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
        ./kcp_proxy_test

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: macos-binaries
        path: |
          build/kcp-proxy-server
          build/kcp-proxy-client
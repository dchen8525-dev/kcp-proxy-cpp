name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, toolchain-free checks. Runs first so a whitespace error or a broken
  # packaging invariant is reported in seconds instead of after three builds.
  hygiene:
    name: whitespace + packaging smoke
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      with:
        # git diff --check needs the base commit, which a shallow clone lacks.
        fetch-depth: 0

    - name: Check whitespace (git diff --check)
      shell: bash
      run: |
        set -euo pipefail

        # Check only the lines this change introduces, by comparing against the
        # commit it is based on. AGENTS.md requires `git diff --check` to pass.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="${{ github.base_ref }}"
          # fetch-depth: 0 already brought every branch, so origin/$base normally
          # exists and no fetch is needed. It is fetched only as a fallback, and
          # WITHOUT --depth: a shallow fetch marks the repo shallow, after which
          # the three-dot diff below dies with "no merge base" (exit 128) -- i.e.
          # the step would fail on every pull request it was meant to protect.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$base" >/dev/null; then
            git fetch --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base"
          fi
          range="refs/remotes/origin/$base...HEAD"
        elif [ -n "${{ github.event.before }}" ] \
             && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          range="${{ github.event.before }}..HEAD"
        elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
          # workflow_dispatch / a branch's very first push have no usable base.
          range="HEAD^..HEAD"
        else
          echo "No base commit to compare against; nothing to check."
          exit 0
        fi

        echo "git diff --check over $range"
        git diff --check "$range"

    - name: Install clang-format (formatting check for changed C++ lines)
      # The smoke suite's format check is skipped when clang-format is missing,
      # so without this step CI would silently never enforce it. The version is
      # pinned to the major that formatted the tree: clang-format's output
      # changes between majors, and the check refuses a mismatched version
      # rather than reporting formatting that is correct for another one.
      run: |
        set -euo pipefail
        if command -v clang-format-22 >/dev/null; then
          echo "clang-format-22 already present on this image"
        else
          # Try the distro package first; fall back to apt.llvm.org, which is
          # where LLVM publishes versions the distro does not ship.
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq clang-format-22; then
            echo "distro has no clang-format-22; trying apt.llvm.org"
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            . /etc/os-release
            echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
              | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang-format-22
          fi
        fi
        echo "CLANG_FORMAT=$(command -v clang-format-22)" >> "$GITHUB_ENV"
        clang-format-22 --version

    - name: Packaging / deployment smoke tests
      run: python3 tests/smoke/smoke_test.py
      env:
        # Compare against the change's base commit, so "added lines" means the
        # same set the whitespace step above inspects. Empty on a first push;
        # the suite falls back to HEAD in that case.
        KCP_SMOKE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # This is the only job that installs the pinned clang-format, so it is
        # the only one that may fail when the tool is missing. The build jobs
        # run the same suite through ctest and do not install it; they skip.
        KCP_REQUIRE_CLANG_FORMAT: "1"

  # The GUI had tests (`npm test`) and a syntax/JSON check (`npm run check`)
  # that CI never ran, so a broken main.js or a malformed electron-builder
  # config failed only at release time. Both are stdlib Node -- no npm install
  # needed -- and the runtime tests skip themselves when no client binary was
  # built (see gui/electron/test/launch-contract.test.js).
  gui-checks:
    name: Electron GUI checks
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Syntax + builder-config check
      working-directory: gui/electron
      run: npm run check

    - name: Unit tests
      working-directory: gui/electron
      run: node --test

  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: c5a15727ee70fddf0296f0d8aafc3f58916fefac
        vcpkgJsonGlob: '**/vcpkg.json'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-binaries
        path: |
          build/kcp-proxy-server
          build/kcp-proxy-client

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: c5a15727ee70fddf0296f0d8aafc3f58916fefac
        vcpkgJsonGlob: '**/vcpkg.json'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Run tests
      run: |
        cd build
        ctest -C Release --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-binaries
        path: |
          build/Release/kcp-proxy-server.exe
          build/Release/kcp-proxy-client.exe
          build/vcpkg_installed/x64-windows/bin/*.dll

  # build-macos is a compile/test gate, not a packaging step: releases ship
  # Linux + Windows only (see release.yml). One phase needs platform care --
  # adversarial e2e phase B floods from 800 distinct 127/8 source addresses,
  # which macOS does not provide (only 127.0.0.1 is configured on lo0), so it
  # skips there; the single-source per-address-gate coverage it would otherwise
  # duplicate already runs on every platform in robustness phase B.
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        brew install cmake openssl

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: c5a15727ee70fddf0296f0d8aafc3f58916fefac
        vcpkgJsonGlob: '**/vcpkg.json'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: macos-binaries
        path: |
          build/kcp-proxy-server
          build/kcp-proxy-client